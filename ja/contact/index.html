  <link rel="alternate" hreflang="ja" href="https://randomly-pick.com/ja/contact/" />

  <link rel="alternate" hreflang="x-default" href="https://randomly-pick.com/contact/" />
  <script data-rlt-legal-canonical-patch>
    (function(){
      try {
        var url = new URL(window.location.href);
        var host = url.hostname.toLowerCase();
        var supportedLangs = /^(?:ko|en|ja|zh-cn|zh-tw|es|fr|de|pt-br|hi|ar|ru|id|tr|it|vi|th|nl)$/i;
        var localizedLegalLangs = /^(?:en|ja|zh-cn|zh-tw)$/i;
        var legalPathRegex = /^\/(?:(?:(?:ko|en|ja|zh-cn|zh-tw|es|fr|de|pt-br|hi|ar|ru|id|tr|it|vi|th|nl))\/)?contact\/?$/i;
        var changed = false;
        if (legalPathRegex.test(url.pathname) && url.searchParams.has('lang')) {
          var qLang = String(url.searchParams.get('lang') || '').toLowerCase();
          if (supportedLangs.test(qLang)) {
            var nextPath = '/' + 'contact' + '/';
            if (localizedLegalLangs.test(qLang)) nextPath = '/' + qLang + '/' + 'contact' + '/';
            else if (qLang !== 'ko') nextPath = '/en/' + 'contact' + '/';
            if (nextPath !== url.pathname) {
              url.pathname = nextPath;
              changed = true;
            }
          }
          url.searchParams.delete('lang');
          changed = true;
        }
        if (host === 'www.randomly-pick.com') {
          url.hostname = 'randomly-pick.com';
          changed = true;
        }
        if (changed) window.location.replace(url.toString());
      } catch (e) {}
    })();
  </script>

    main { max-width: 920px; margin: 0 auto; padding: 32px 18px 64px; line-height: 1.75; }

    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; color: var(--text); text-decoration: none; font-weight: 600; }

    a { color: var(--accent); }
